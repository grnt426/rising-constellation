# Tetrarchy Falls — production nginx vhost (HTTP only).
#
# Request path: viewer -> CloudFront -> ALB (TLS terminates here) -> this
# vhost on :80 -> Phoenix on 127.0.0.1:4000. bootstrap-host.sh installs this
# file as /etc/nginx/sites-available/rc.conf with __RC_HOST__ substituted.
# This is the source of truth for the live host: to change it, edit here,
# copy it over the same way, then `sudo nginx -t && sudo systemctl reload
# nginx`. (rc.conf.example is the standalone-TLS variant, documentation only.)

# nginx 1.18's mime.types predates AVIF; without this, the landing page's
# .avif variants go out as application/octet-stream. `types` blocks at the
# http level (sites-enabled/* is included there) add to mime.types.
types {
    image/avif avif;
}

# Cache-Control for the Vue SPA under /portal/ (used in `location /portal/`).
map $uri $rc_portal_cache_control {
    # Webpack content-hashed output (js/app.c245ec41.js, img/menu.dd24d051.jpg,
    # and their .map files): the name changes whenever the bytes do.
    "~^/portal/.+\.[0-9a-f]{8}\.[a-z0-9.]+$"  "public, max-age=31536000, immutable";
    # The shell, which is also the fallback for client-side routes, must be
    # revalidated on every load (a cheap 304 via ETag), or a browser can keep
    # booting the previous deploy's bundle names.
    "/portal/index.html"                      "no-cache";
    # Unhashed public/ copies (map/, music/, sound/, ...) send no header and
    # get heuristic caching, as before.
    default                                   "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __RC_HOST__ _;

    root /home/rc/www-root/asylamba/static;

    # nginx.conf turns gzip on for text/html only. Compress regardless of a
    # Via header (CloudFront sets one on origin requests), and tell caches the
    # body varies. Per-location gzip_types below decide what else qualifies.
    gzip_proxied any;
    gzip_vary on;

    # Phoenix digest output (foo-<32 hex>.ext): safe to cache for a year.
    location ~* "-[a-f0-9]{32}\.(?:css|js|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot)$" {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # The frontend (Hooks.login in assets/js/app.js) redirects to "/portal"
    # without a trailing slash after login. nginx location matching for
    # "/portal/" doesn't match "/portal", so add an explicit 301.
    location = /portal { return 301 /portal/; }

    # Shareable SPA URLs (Forge map/scenario detail + editor pages, game
    # lobbies). These go to Phoenix instead of the static bundle:
    # Portal.SpaShareController serves the same index.html with the row's
    # OpenGraph tags injected, so a link copied straight from the address
    # bar unfurls on Discord. Regex locations beat the /portal/ prefix
    # below. proxy_intercept_errors: a release without those routes (or a
    # missing index file) 404s, and a stopped Phoenix 502s; either way we
    # fall back to the static SPA, so deep links never break on a version
    # skew or mid-deploy restart.
    # Detail, scenario-from-map and lobby pages take a share token or a
    # numeric id; the (author-only) editors stay numeric.
    location ~ "^/portal/(?:(?:create/(?:map/view|scenario/(?:view|new))|instance)/[A-Za-z0-9_-]+|create/(?:map|scenario/edit)/\d+)$" {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 502 504 = /portal/index.html;
    }

    location /portal/ {
        alias /home/rc/www-root/asylamba/front/;
        try_files $uri $uri/ /portal/index.html;
        # Empty value (the map default) emits no header.
        add_header Cache-Control $rc_portal_cache_control;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
        # API responses are uncached at CloudFront (CachingDisabled), and
        # CloudFront only compresses what it caches, so JSON has to be
        # compressed here. Scoped to /api/ on purpose: for cached paths
        # CloudFront brotli-compresses on its own, and it never re-compresses
        # an object the origin already gzipped.
        gzip_types application/json;
    }

    location /socket/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /live/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri @phoenix;
    }

    location @phoenix {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
